name: Morning briefing

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_VOICE: nova
          BRIEFING_LANGUAGE: English
        run: python briefing.py

      - name: Archiver le texte du jour
        continue-on-error: true
        run: |
          set +e
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            mkdir -p history
            cp public/briefing.txt "history/$(date -u +%F).txt"
            git fetch origin main
            git reset --soft origin/main
            git add history
            if git diff --cached --quiet; then
              echo "Rien à committer"
              break
            fi
            git commit -m "Briefing $(date -u +%F)"
            git push origin HEAD:main && break
            echo "Push refusé, nouvelle tentative..."
            sleep $((RANDOM % 5 + 2))
          done
          exit 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
